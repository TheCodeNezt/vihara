<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to Vihara | Grand Opening</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-align: center;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 10px;
      color: #ff6b00;
      text-transform: uppercase;
    }

    p {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 40px;
    }

    /* Ribbon Container */
    .ribbon-container {
      position: relative;
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Ribbon Left Half */
    .ribbon-half {
      height: 60px;
      width: 50%;
      background: linear-gradient(135deg, #ff6b00, #ff8800);
      box-shadow: 0 10px 25px rgba(255, 107, 0, 0.4);
      position: absolute;
      transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      letter-spacing: 3px;
      font-size: 0.9rem;
      color: #ffffff;
    }

    .ribbon-left {
      left: 0;
      transform-origin: left center;
      border-top-right-radius: 4px;
      border-bottom-right-radius: 4px;
    }

    .ribbon-right {
      right: 0;
      transform-origin: right center;
      border-top-left-radius: 4px;
      border-bottom-left-radius: 4px;
    }

    /* Scissors Icon */
    .scissors {
      position: absolute;
      z-index: 10;
      font-size: 3rem;
      background: #1e293b;
      padding: 15px;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(255, 107, 0, 0.5);
      border: 2px solid #ff6b00;
      transition: transform 0.3s ease;
    }

    .ribbon-container:hover .scissors {
      transform: scale(1.15) rotate(-10deg);
    }

    /* Animation Cut States */
    .cut .ribbon-left {
      transform: rotate(-25deg) translateY(120px);
      opacity: 0;
    }

    .cut .ribbon-right {
      transform: rotate(25deg) translateY(120px);
      opacity: 0;
    }

    .cut .scissors {
      transform: scale(0) rotate(180deg);
      opacity: 0;
      transition: all 0.5s ease;
    }

    .redirect-msg {
      margin-top: 30px;
      font-size: 1.2rem;
      color: #ff6b00;
      opacity: 0;
      transition: opacity 0.5s ease;
      font-weight: 600;
    }

    .redirect-msg.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <h1>GRAND INAUGURATION</h1>
  <p>Click the ribbon to officially launch <strong>Vihara</strong></p>

  <div class="ribbon-container" id="ribbon" onclick="cutRibbon()">
    <div class="ribbon-half ribbon-left">VIHARA</div>
    <div class="scissors">✂️</div>
    <div class="ribbon-half ribbon-right">OFFICIAL</div>
  </div>

  <div class="redirect-msg" id="msg">🎉 Opening Vihara... Welcome!</div>

  <script>
    function cutRibbon() {
      const ribbon = document.getElementById('ribbon');
      const msg = document.getElementById('msg');
      
      // Trigger the cut animation
      ribbon.classList.add('cut');
      
      // Show redirect text
      setTimeout(() => {
        msg.classList.add('show');
      }, 500);

      // Redirect to main site (index.html) after 2 seconds
      setTimeout(() => {
        window.location.href = "index.html"; 
      }, 2200);
    }
  </script>
</body>
</html>
